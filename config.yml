tableau_principal: ["PALUDISME SUSP", "PALUDISME CONF", "FIEVRE TYPHOIDE", "ROUGEOLE", "CHOLERA", "DIARR SANGLANTE", "MONKEYPOX", "MENINGITE", "PFA", "DIPHTERIE", "COQUELUCHE", "FIEVRE JAUNE", "DECES MATERNELS", "FHA", "RAGE", "PESTE"]
tableau_autres: ["IRA", "PNEUMONIE", "GRIPPE", "DIARRHEE DHY M5"]
